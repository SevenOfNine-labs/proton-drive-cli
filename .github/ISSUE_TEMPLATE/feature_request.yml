name: Feature request
description: A change to a command, the bridge contract or the docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you suggest, and any official Proton SDK or CLI behavior it follows.

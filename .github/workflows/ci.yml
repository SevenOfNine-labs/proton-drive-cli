name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init submodules (non-recursive)
        run: git submodule update --init --depth=1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Node.js 25 and later ship without Corepack (https://nodejs.org/docs/latest-v24.x/api/corepack.html).
      - name: Enable Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Build vendored SDK
        run: cd submodules/sdk/client/js && npm install --no-package-lock --no-audit --no-fund && npm run build

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck (tsc --noEmit)
        run: yarn lint

      - name: Comment policy (AGENTS.md, Code Comments and Legacy)
        run: bash scripts/check-comment-policy.sh

      - name: Build
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init submodules (non-recursive)
        run: git submodule update --init --depth=1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Node.js 25 and later ship without Corepack (https://nodejs.org/docs/latest-v24.x/api/corepack.html).
      - name: Enable Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Build vendored SDK
        run: cd submodules/sdk/client/js && npm install --no-package-lock --no-audit --no-fund && npm run build

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

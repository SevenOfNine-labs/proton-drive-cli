name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-quality:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint.json
          globs: |
            README.md
            SUMMARY.md
            SECURITY.md
            docs/**/*.md

  deploy:
    name: Build and deploy unified docs to GitHub Pages
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout SDK submodule (non-recursive)
        run: |
          git submodule update --init --depth 1 submodules/sdk

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build SDK (uses npm - external Proton project)
        run: |
          cd submodules/sdk/client/js
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Generate TypeDoc API documentation
        run: yarn docs

      - name: Install honkit
        run: npm install -g honkit@6.2.5

      - name: Build markdown docs with honkit
        run: honkit build

      # Landing page is tracked at docs/site/index.html. The JSON schemas are
      # published too: every schema $id is under
      # https://sevenofnine-labs.github.io/proton-drive-cli/schemas/.
      - name: Create unified documentation structure
        run: |
          mkdir -p docs-build/unified
          cp -r _book docs-build/unified/guides
          cp -r docs/api docs-build/unified/typescript
          cp -r schemas docs-build/unified/schemas
          cp docs/site/index.html docs-build/unified/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-build/unified

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
